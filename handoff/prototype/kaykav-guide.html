<title>KayKav Course Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: photo-studio stage for the 3D guide (left, always lit like the renders) + course chat (right); stacks on phones */
:root{
  --bg:#ECEFF6; --surface:#FFFFFF; --ink:#16204A; --muted:#5A6590; --line:#D7DCEC;
  --accent:#2C47B0; --accent-ink:#FFFFFF; --mint:#1C9C7B; --glow:#D9A800;
  --bubble-bot:#F0F3FA; --shadow:rgba(30,45,110,.10);
  --studio-a:#F3F5F3; --studio-b:#E7EBEC; --stage-ink:#1A2250; --stage-muted:#5E6890;
  --stage-glass:rgba(255,255,255,.78); --stage-line:rgba(26,34,80,.10); --screen:#17244F; --screen-2:#24366C;
  --font-display:"Cormorant Garamond","Cormorant",Georgia,serif;
  --font-body:"Figtree","Delight",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A0F27; --surface:#121939; --ink:#E6EAFB; --muted:#98A2CC; --line:#252F5E;
  --accent:#93A9FF; --accent-ink:#0A0F27; --mint:#5FE0BE; --glow:#FFE36A;
  --bubble-bot:#1B2350; --shadow:rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A0F27; --surface:#121939; --ink:#E6EAFB; --muted:#98A2CC; --line:#252F5E;
  --accent:#93A9FF; --accent-ink:#0A0F27; --mint:#5FE0BE; --glow:#FFE36A;
  --bubble-bot:#1B2350; --shadow:rgba(0,0,0,.35); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;max-width:1480px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Stage: a fixed light studio so the resin reads as in the renders, in both themes */
.stage{position:relative;min-height:0;border-radius:22px;overflow:hidden;color:var(--stage-ink);
  background:radial-gradient(90% 75% at 50% 42%,var(--studio-a) 0%,var(--studio-b) 100%);border:1px solid var(--stage-line)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.stage-top{position:absolute;top:0;left:0;right:0;padding:20px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;pointer-events:none}
.eyebrow{margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--stage-muted)}
h1{margin:0;font-family:var(--font-display);font-weight:600;font-size:clamp(26px,3vw,38px);line-height:1.02;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic;font-weight:500;color:#2C47B0}
.seg{pointer-events:auto;display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--stage-glass);border:1px solid var(--stage-line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;color:var(--stage-muted)}
.seg button:hover{color:var(--stage-ink)}
.seg button[aria-pressed="true"]{background:var(--stage-ink);color:#fff}
.stage-bottom{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}
.face-btn{pointer-events:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--stage-line);background:var(--stage-glass);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:5px 14px 5px 5px;cursor:pointer;color:var(--stage-ink);
  box-shadow:0 6px 20px rgba(30,45,110,.08)}
.face-btn canvas{width:52px;height:32px;border-radius:999px;display:block}
.face-btn span{font-size:13px;font-weight:600}
.face-btn small{font-weight:500;color:var(--stage-muted);font-size:12px;margin-left:2px}
.hint{font-size:12px;color:var(--stage-muted);text-align:right;line-height:1.4;max-width:230px;margin:0}

.sheet{position:absolute;left:10px;right:10px;bottom:10px;max-height:min(66%,520px);display:flex;flex-direction:column;border-radius:18px;
  background:rgba(250,251,253,.95);border:1px solid var(--stage-line);box-shadow:0 18px 50px rgba(30,45,110,.18);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden}
.sheet[hidden]{display:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 8px 18px}
.sheet-head strong{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--stage-muted);font-weight:600}
.sheet-head button{border:0;background:transparent;cursor:pointer;color:var(--stage-ink);font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px}
.sheet-head button:hover{background:rgba(26,34,80,.06)}
.grid{overflow-y:auto;padding:4px 14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px 10px}
.tile{border:0;background:transparent;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--stage-ink)}
.tile canvas{width:100%;aspect-ratio:1.6;max-width:100%;display:block;border-radius:16px;transition:transform .15s}
.tile:hover canvas{transform:translateY(-2px)}
.tile[aria-pressed="true"] canvas{outline:2.5px solid #2C47B0;outline-offset:2px}
.tile span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}

.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--stage-muted)}

/* Chat */
.chat{min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.avatar{width:40px;height:40px;flex:none;border-radius:13px;background:linear-gradient(160deg,var(--screen-2),var(--screen));display:grid;place-items:center;box-shadow:0 0 0 3px #CCD5F2}
.avatar canvas{width:34px;height:21px;display:block}
.who{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.who strong{font-weight:600;font-size:15px}
.status{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mint)}
.dot[data-s="think"]{background:var(--glow);animation:pulse 1s ease-in-out infinite}
.dot[data-s="talk"]{background:var(--accent);animation:pulse .5s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.log{flex:1;min-height:0;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.msg.bot{align-self:flex-start;background:var(--bubble-bot);border-bottom-left-radius:5px}
.msg.pending{color:var(--muted);font-style:italic}
.note{align-self:center;font-size:12px;color:var(--muted);text-align:center;max-width:90%;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 12px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip:disabled{opacity:.45;cursor:default}
form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
#q{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;outline:none}
#q:focus{border-color:var(--accent)}
.btn{border:0;border-radius:12px;padding:0 18px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.stop{background:var(--ink);color:var(--surface)}
.foot{margin:0;padding:0 18px 12px;font-size:11.5px;color:var(--muted);min-height:1em}

@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr)}
  .stage{height:560px}
  .chat{height:560px}
  .hint{display:none}
}
@media (max-width:520px){ .stage-top{padding:16px} .seg button{padding:6px 10px;font-size:12.5px} .stage{height:600px} }
@media (prefers-reduced-motion:reduce){ .dot{animation:none!important} .tile canvas{transition:none} }
</style>

<div class="app">
  <section class="stage" id="stage">
    <canvas id="gl" role="img" aria-label="Interactive 3D model of the KayKav course guide mascot"></canvas>
    <div class="stage-top">
      <div>
        <p class="eyebrow">learn.kaykav.academy · prototype</p>
        <h1>Your course guide, <em>in 3D</em></h1>
      </div>
      <div class="seg" role="group" aria-label="Character version" id="seg"></div>
    </div>
    <div class="stage-bottom">
      <button class="face-btn" id="faceBtn" type="button" aria-expanded="false" aria-controls="sheet">
        <canvas id="faceMini" width="104" height="64"></canvas>
        <span id="faceName">Neutral</span><small>Faces</small>
      </button>
      <p class="hint">Move your cursor. Tap the guide, or flick an antenna.</p>
    </div>
    <div class="sheet" id="sheet" hidden>
      <div class="sheet-head"><strong>Expressions</strong><button type="button" id="sheetClose">Close</button></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <aside class="chat" aria-label="Chat with the course guide">
    <header class="chat-head">
      <div class="avatar" aria-hidden="true"><canvas id="avatar" width="102" height="64"></canvas></div>
      <div class="who">
        <strong>Course guide</strong>
        <span class="status"><span class="dot" id="dot"></span><span id="status">Ready</span></span>
      </div>
    </header>
    <div class="log" id="log" aria-live="polite">
      <div class="msg bot">Hi! I'm your guide for Built, Not Prompted. Ask me about a lesson, your MVP, or an error you're stuck on.</div>
    </div>
    <div class="chips" id="chips">
      <button class="chip" type="button">What will I build in this course?</button>
      <button class="chip" type="button">Explain an API with an analogy</button>
      <button class="chip" type="button">How do I deploy my MVP?</button>
      <button class="chip" type="button">I'm stuck on an error</button>
    </div>
    <form id="form" autocomplete="off">
      <input id="q" name="q" placeholder="Ask the guide anything…" aria-label="Your question" maxlength="800">
      <button class="btn" id="send" type="submit">Send</button>
    </form>
    <p class="foot" id="foot"></p>
  </aside>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = $('stage'), canvas = $('gl');

/* =====================================================================
   1. FACE ARTWORK — every expression from the sheet, drawn as glowing
      strokes on a 1024×640 canvas that maps onto the screen glass.
   ===================================================================== */
const FW = 1024, FH = 640, CY = 320, EL = 256, ER = 768;
const YEL = '#FFE45C', BLUE = '#62C8FF';
const FACES = [
  ['neutral', 'Neutral'], ['happy', 'Happy'], ['sad', 'Sad'], ['surprised', 'Surprised'],
  ['confused', 'Confused'], ['excited', 'Excited'], ['tired', 'Tired'], ['wink', 'Wink'],
  ['crying', 'Crying'], ['laughing', 'Laughing'], ['giggling', 'Laughing hard'], ['shy', 'Shy'],
  ['love', 'Love'], ['thinking', 'Thinking'], ['sleeping', 'Sleeping'], ['dizzy', 'Dizzy'], ['bored', 'Bored'],
  ['proud', 'Proud'], ['skeptical', 'Skeptical'], ['scared', 'Scared'], ['determined', 'Determined'],
  ['playful', 'Playful'], ['curious', 'Curious'], ['shocked', 'Shocked'], ['relaxed', 'Relaxed'], ['gloating', 'Gloating'],
  ['nervous', 'Nervous'], ['jittery', 'Jittery'], ['cheeky', 'Cheeky'], ['peaceful', 'Peaceful'], ['glitch', 'Glitch'],
  ['listening', 'Listening'], ['talking', 'Talking']
];
const FACE_NAME = Object.fromEntries(FACES);
const BLINKS = new Set(['neutral', 'listening', 'talking', 'surprised', 'wink', 'thinking', 'skeptical', 'curious', 'playful', 'cheeky', 'shy', 'laughing', 'crying']);

function faceItems(key, o) {
  const it = [];
  const st = (p, a = 1, w = 28, col = YEL) => it.push({ k: 's', p, a, w, col });
  const fl = (p, a = 1, col = YEL) => it.push({ k: 'f', p, a, col });
  const P = () => new Path2D();
  const Y = v => CY + v;
  const open = BLINKS.has(key) ? o.open : 1;
  const t = o.t;
  const ring = (x, y, r = 58, op = open) => { const p = P(); if (op < 0.18) { p.moveTo(x - r, Y(y)); p.lineTo(x + r, Y(y)); } else { p.moveTo(x + r, Y(y)); p.ellipse(x, Y(y), r, r * op, 0, 0, Math.PI * 2); } st(p); };
  const dash = (x, y, len = 64, a = 1) => { const p = P(); p.moveTo(x - len / 2, Y(y)); p.lineTo(x + len / 2, Y(y)); st(p, a); };
  const d3 = (opt = {}) => [404, 512, 620].forEach((x, k) => dash(x, (opt.y || 0) + (opt.dy ? opt.dy(k) : 0), opt.len ? opt.len(k) : 64, opt.a ? opt.a(k) : 1));
  const dot = (x, y, r, a = 1) => { const p = P(); p.arc(x, Y(y), r, 0, Math.PI * 2); fl(p, a); };
  const line = (x1, y1, x2, y2, a = 1, w = 28) => { const p = P(); p.moveTo(x1, Y(y1)); p.lineTo(x2, Y(y2)); st(p, a, w); };
  const caret = (x, y) => { const p = P(); p.moveTo(x - 56, Y(y + 24)); p.quadraticCurveTo(x, Y(y - 70), x + 56, Y(y + 24)); st(p); };
  const cup = (x, y) => { const p = P(); p.moveTo(x - 50, Y(y - 22)); p.quadraticCurveTo(x, Y(y + 66), x + 50, Y(y - 22)); st(p); };
  const chev = (x, y, d) => { const p = P(); p.moveTo(x - 34 * d, Y(y - 46)); p.lineTo(x + 38 * d, Y(y)); p.lineTo(x - 34 * d, Y(y + 46)); st(p); };
  const heart = (x, y, s = 1) => { const p = P(); p.moveTo(x, Y(y + 50 * s)); p.bezierCurveTo(x - 74 * s, Y(y + 2 * s), x - 56 * s, Y(y - 62 * s), x, Y(y - 24 * s)); p.bezierCurveTo(x + 56 * s, Y(y - 62 * s), x + 74 * s, Y(y + 2 * s), x, Y(y + 50 * s)); p.closePath(); st(p, 1, 24); };
  const aster = (x, y, r = 48) => { const p = P(); for (const a of [Math.PI / 2, Math.PI / 6, -Math.PI / 6]) { p.moveTo(x - Math.cos(a) * r, Y(y - Math.sin(a) * r)); p.lineTo(x + Math.cos(a) * r, Y(y + Math.sin(a) * r)); } st(p, 1, 24); };
  const zig = (x, y, d) => { const pts = [[-30, -50], [34, -30], [-20, 0], [34, 30], [-30, 50]]; const p = P(); pts.forEach(([px, py], i) => i ? p.lineTo(x + px * d, Y(y + py)) : p.moveTo(x + px * d, Y(y + py))); st(p, 1, 24); };
  const bolt = (x, y) => { const p = P(); p.moveTo(x + 14, Y(y - 62)); p.lineTo(x - 26, Y(y + 6)); p.lineTo(x + 4, Y(y + 6)); p.lineTo(x - 12, Y(y + 64)); p.lineTo(x + 28, Y(y - 8)); p.lineTo(x - 2, Y(y - 8)); p.closePath(); st(p, 1, 20); };
  const quote = (x, y, flip) => {
    const T = (px, py) => flip ? [x - px, Y(y - py)] : [x + px, Y(y + py)];
    const c = T(0, 16), p = P(); p.arc(c[0], c[1], 31, 0, Math.PI * 2); fl(p);
    const q = P(), a = T(-26, 4), b = T(-30, -44), e = T(12, -60); q.moveTo(a[0], a[1]); q.quadraticCurveTo(b[0], b[1], e[0], e[1]); st(q, 1, 22);
  };
  const excl = (x, y) => { line(x, y - 58, x, y + 4, 1, 24); dot(x, y + 44, 14); };
  const spiral = (x, y, rot) => { const p = P(), tm = Math.PI * 2 * 1.75; for (let a = 0; a <= tm; a += 0.1) { const r = 8 + 54 * (a / tm), px = x + Math.cos(a + rot) * r, py = Y(y) + Math.sin(a + rot) * r; a ? p.lineTo(px, py) : p.moveTo(px, py); } st(p, 1, 17); };
  const zed = (x, y, s, a) => { const p = P(); p.moveTo(x - s / 2, Y(y - s / 2)); p.lineTo(x + s / 2, Y(y - s / 2)); p.lineTo(x - s / 2, Y(y + s / 2)); p.lineTo(x + s / 2, Y(y + s / 2)); st(p, a, Math.max(12, s * 0.2)); };
  const question = (x, y) => { const p = P(); p.moveTo(x - 36, Y(y - 36)); p.bezierCurveTo(x - 36, Y(y - 92), x + 44, Y(y - 92), x + 42, Y(y - 40)); p.bezierCurveTo(x + 40, Y(y - 12), x, Y(y - 10), x, Y(y + 20)); st(p, 1, 24); dot(x, y + 60, 14); };
  const tear = (x, y, a) => { const p = P(); p.moveTo(x, Y(y - 30)); p.bezierCurveTo(x + 6, Y(y - 16), x + 19, Y(y - 2), x + 19, Y(y + 8)); p.arc(x, Y(y + 8), 19, 0, Math.PI); p.bezierCurveTo(x - 19, Y(y - 2), x - 6, Y(y - 16), x, Y(y - 30)); fl(p, a, BLUE); };
  const wave = (x0, x1, y, amp, cyc, ph, tri) => { const p = P(); for (let i = 0; i <= 80; i++) { const u = i / 80, x = lerp(x0, x1, u), th = u * cyc * Math.PI * 2 + ph; const s = tri ? (2 / Math.PI) * Math.asin(Math.sin(th)) : Math.sin(th); i ? p.lineTo(x, Y(y + s * amp)) : p.moveTo(x, Y(y + s * amp)); } st(p, 1, 24); };
  const pGlyph = (x, y) => { ring(x + 6, y - 8, 42, 1); line(x - 36, y - 8, x - 36, y + 82); };
  const lid = (x, y) => { const p = P(); p.moveTo(x - 56, Y(y - 4)); p.lineTo(x + 56, Y(y - 4)); p.moveTo(x - 44, Y(y - 4)); p.arc(x, Y(y - 4), 44, Math.PI, 0, true); st(p); };

  switch (key) {
    case 'neutral': ring(EL, 0); ring(ER, 0); d3(); break;
    case 'listening': ring(EL, 0, 64); ring(ER, 0, 64); d3({ a: () => 0.55 + 0.45 * Math.sin(t * 4.2) }); break;
    case 'talking': ring(EL, 0); ring(ER, 0); d3({ dy: k => Math.sin(t * 15 + k * 2.1) * 24 * o.talk, len: k => 64 + Math.sin(t * 11 + k * 1.3) * 22 * o.talk }); break;
    case 'happy': caret(EL, 0); caret(ER, 0); d3({ y: 4 }); break;
    case 'sad': cup(EL, 6); cup(ER, 6); d3({ y: -10 }); break;
    case 'surprised': ring(EL, 0, 70); ring(ER, 0, 70); d3(); break;
    case 'confused': ring(EL + 22, 0, 40); ring(ER - 22, 0, 40); dash(392, 0, 38); dash(632, 0, 38); question(512, 0); break;
    case 'excited': chev(EL, 0, 1); chev(ER, 0, -1); d3(); break;
    case 'tired': lid(EL, 0); lid(ER, 0); d3({ a: () => 0.75 }); break;
    case 'wink': ring(EL, 0); aster(ER, 0); d3(); break;
    case 'crying': ring(EL, 0); ring(ER, 0); d3(); [EL, ER].forEach((x, i) => { const u = (t * 0.7 + i * 0.45) % 1; tear(x, 96 + u * 70, Math.sin(u * Math.PI)); }); break;
    case 'laughing': ring(EL, 0); zig(ER, 0, 1); d3(); break;
    case 'giggling': zig(EL, 0, -1); zig(ER, 0, 1); d3(); break;
    case 'shy': ring(EL, 0); ring(ER, 0); dash(374, 42, 44); dash(468, 0, 44); dash(556, 0, 44); dash(650, 42, 44); break;
    case 'love': { const s = 1 + 0.07 * Math.sin(t * 7); heart(EL, 0, s); heart(ER, 0, s); d3(); break; }
    case 'thinking': ring(EL, 0); dot(ER, 0, 28 * (0.86 + 0.14 * Math.sin(t * 5))); d3({ a: k => 0.25 + 0.75 * Math.pow(Math.max(0, Math.sin(t * 5.5 - k * 1.1)), 2) }); break;
    case 'sleeping': [[330, 92, 62], [430, 52, 84], [548, 0, 108], [682, -66, 134]].forEach(([x, y, s], i) => zed(x, y + Math.sin(t * 1.6 + i) * 6, s, 0.55 + 0.45 * Math.sin(t * 1.6 + i * 0.9) ** 2)); break;
    case 'dizzy': spiral(EL, 0, t * 4); spiral(ER, 0, t * 4); d3(); break;
    case 'bored': dot(EL, 0, 40); dot(ER, 0, 40); dash(398, 0, 40); dash(512, 30, 58); dash(626, 0, 40); break;
    case 'proud': caret(EL, 0); caret(ER, 0); d3({ y: 30 }); break;
    case 'skeptical': ring(EL, 0); line(ER - 50, -44, ER + 50, -54); d3(); break;
    case 'scared': bolt(EL, 0); bolt(ER, 0); d3(); break;
    case 'determined': chev(EL, 0, 1); chev(ER, 0, -1); dash(366, 42, 44); dash(468, 0, 44); dash(556, 0, 44); dash(658, 42, 44); break;

// Glow strokes: a wide warm halo, then a tight bright core (the sheet's neon look)
function paintFace(ctx, key, o, s) {
  const items = faceItems(key, o);
  ctx.save();
  ctx.translate(o.lx * 58, -o.ly * 34);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [blur, warm] of [[30, 'rgba(255,172,20,0.95)'], [9, 'rgba(255,240,170,0.9)']]) {

      ctx.shadowColor = i.col === BLUE ? 'rgba(70,175,255,0.95)' : warm;
      if (i.k === 's') { ctx.strokeStyle = i.col; ctx.lineWidth = i.w; ctx.stroke(i.p); } else { ctx.fillStyle = i.col; ctx.fill(i.p); }

float smin(float a, float b, float k){ float h = max(k-abs(a-b),0.0)/k; return min(a,b) - h*h*k*0.25; }

    case 'tired': case 'bored': m.pitch = 0.1; m.droop = 0.6; m.roll = 0.07; break;
    case 'sleeping': m.pitch = 0.14; m.droop = 1; m.roll = Math.sin(t * 0.8) * 0.05; break;
    case 'thinking': m.roll = 0.11; m.pitch = -0.08; break;

    case 'confused': m.roll = 0.15 * Math.sin(t * 1.4); break;

    case 'scared': case 'nervous': case 'jittery': m.x = Math.sin(t * 46) * 0.018 * amp; m.roll = Math.sin(t * 31) * 0.02 * amp; break;

  // arms (Buddy, Tall)
  const waving = now < S.waveUntil ? Math.sin(Math.PI * (S.waveUntil - now) / 1700) : 0;
  const idleWave = reduce ? 0 : clamp((Math.sin(t * 0.55) - 0.9) / 0.1, 0, 1) * 0.5;
  const wv = Math.max(waving, idleWave) * (reduce ? 0.4 : 1);
  let armL = Math.sin(t * 1.3) * 0.04 + droop * 0.06, armR = 0, arm2 = 0;
  if (S.variant === 'buddy') armR = Math.sin(t * 10) * 0.32 * wv - droop * 0.5;
  if (S.variant === 'tall') { arm2 = Math.sin(t * 9) * 0.38 * wv; armR = -droop * 0.6; }
  world.arm = [armL, armR, arm2];

  // antenna glow level
  let glow = 0.75;
  if (f === 'thinking') glow = 0.95 + 0.25 * Math.sin(t * 6);
  else if (f === 'talking') glow = 0.75 + S.talk * 0.4;
  else if (sleepy) glow = 0.25;
  world.glow = lerp(world.glow, glow, Math.min(1, dt * 5));

  world.Rb = euler(pose.yaw, pose.pitch, pose.roll); world.Rh = euler(pose.hyaw, pose.hpitch, pose.hroll);

  if (!gl || !visible) return;
  fctx.clearRect(0, 0, FW, FH);
  paintFace(fctx, f, { t, open: pose.open, talk: S.talk, lx: pose.lx * 0.9, ly: pose.ly * 0.9 }, 1);

  frameEMA = lerp(frameEMA, ft || 16, 0.05);
  if (!fixedQ && now - lastAdj > 1200) {
    lastAdj = now;
    if (frameEMA > 24 && quality > 0.55) { quality = Math.max(0.55, quality - 0.15); resize(); }
    else if (frameEMA < 15 && quality < maxQ) { quality = Math.min(maxQ, quality + 0.1); resize(); }
  }
  draw(t);
}

function toWorldFromHead(v, ph) {
  const pb = add(M.ap(world.Rh, sub(ph, v.P0)), v.pivot);
  return add(M.ap(world.Rb, mulv(pb, world.squash)), world.bodyPos);
}

function draw(t) {
  const v = VARIANTS[S.variant], P = program(S.variant), u = P.u;
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(P.p);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, faceTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, faceCanvas);
  gl.uniform1i(u.uFace, 0);
  gl.uniform2f(u.uRes, canvas.width, canvas.height); gl.uniform1f(u.uTime, t);
  gl.uniform3fv(u.uCamPos, cam.pos); gl.uniform3fv(u.uCamX, cam.X); gl.uniform3fv(u.uCamY, cam.Y); gl.uniform3fv(u.uCamZ, cam.Z); gl.uniform1f(u.uFocal, cam.focal);
  gl.uniformMatrix3fv(u.uBodyInv, false, M.col(M.tr(world.Rb))); gl.uniform3fv(u.uBodyPos, world.bodyPos); gl.uniform3fv(u.uSquash, world.squash);
  gl.uniformMatrix3fv(u.uHeadInv, false, M.col(M.tr(world.Rh))); gl.uniform3fv(u.uHeadPivot, v.pivot);
  gl.uniformMatrix3fv(u.uAntInvL, false, M.col(M.tr(world.antRot[0]))); gl.uniformMatrix3fv(u.uAntInvR, false, M.col(M.tr(world.antRot[1])));
  const [aL, aR, a2] = world.arm;
  gl.uniform4f(u.uArm, Math.cos(-aL), Math.sin(-aL), Math.cos(-aR), Math.sin(-aR));
  gl.uniform4f(u.uArm2, Math.cos(-a2), Math.sin(-a2), 0, 0);
  gl.uniform1f(u.uGlow, world.glow);
  const bc = add(M.ap(world.Rb, mulv(v.bound.c, world.squash)), world.bodyPos);
  gl.uniform3fv(u.uBoundC, bc); gl.uniform1f(u.uBoundR, v.bound.r * Math.max(...world.squash) + 0.15);
  gl.uniform1f(u.uGroundY, v.ground);
  // halo points: antenna roots (mint) and, on the Pod, a warm bulb tip
  const A = v.A, hp = [], hc = [];
  const antPt = (i, local) => toWorldFromHead(v, add(M.ap(world.antRot[i], local), i ? A.br : A.bl));
  const top = v.HS[1] - A.bl[1];
  hp.push(...antPt(0, [0, top + 0.05, 0]), ...antPt(1, [0, top + 0.05, 0]));
  hc.push(0.35, 0.95, 0.8, 0.16 * world.glow, 0.35, 0.95, 0.8, 0.16 * world.glow);
  hp.length = 0; hc.length = 0;
  if (v.warm) { hp.push(...antPt(0, A.tl), ...antPt(1, A.tr), 0, -99, 0); hc.push(1.0, 0.78, 0.55, 0.16, 1.0, 0.78, 0.55, 0.16, 0, 0, 0, 0); }
  else { hp.push(...antPt(0, [0, top + 0.05, 0]), ...antPt(1, [0, top + 0.05, 0]), 0, -99, 0); hc.push(0.35, 0.95, 0.8, 0.16 * world.glow, 0.35, 0.95, 0.8, 0.16 * world.glow, 0, 0, 0, 0); }
  gl.uniform3fv(u.uHaloP, new Float32Array(hp)); gl.uniform4fv(u.uHaloC, new Float32Array(hc));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  world.antTips = [antPt(0, A.tl), antPt(1, A.tr)];
  world.antBases = [antPt(0, [0, top, 0]), antPt(1, [0, top, 0])];
}

/* =====================================================================
   7. INTERACTION
   ===================================================================== */
let chatDir = [0.9, -0.15];
function updateChatDir() {
  const r = stage.getBoundingClientRect(), c = document.querySelector('.chat').getBoundingClientRect();
  const dx = (c.left + c.width / 2) - (r.left + r.width / 2), dy = (c.top + c.height / 2) - (r.top + r.height / 2), l = Math.hypot(dx, dy) || 1;
  chatDir = [clamp(dx / l, -1, 1) * 0.9, clamp(-dy / l, -1, 1) * 0.6];
}
function overGuide(x, y) {
  if (!gl || !cam) return false;
  const v = VARIANTS[S.variant], c3 = add(M.ap(world.Rb, v.bound.c), world.bodyPos);
  const c = project(c3), e = project(add(c3, scl(cam.X, v.bound.r * 0.75)));
  return !!(c && e) && Math.hypot(x - c[0], y - c[1]) < Math.hypot(e[0] - c[0], e[1] - c[1]);
}
addEventListener('pointermove', e => {
  const r = stage.getBoundingClientRect();
  pointer.x = clamp((e.clientX - (r.left + r.width / 2)) / (r.width / 2), -1.6, 1.6) * 0.85;
  pointer.y = clamp(-(e.clientY - (r.top + r.height * 0.45)) / (r.height / 2), -1.4, 1.4) * 0.85;
  pointer.inWin = true;
  if (e.target === canvas) canvas.style.cursor = overGuide(e.clientX - r.left, e.clientY - r.top) ? 'pointer' : 'default';
  wake();
}, { passive: true });
document.documentElement.addEventListener('pointerleave', () => { pointer.inWin = false; });
addEventListener('keydown', wake);

function segDist(p, a, b) { const ab = [b[0] - a[0], b[1] - a[1]], ap = [p[0] - a[0], p[1] - a[1]]; const t = clamp((ap[0] * ab[0] + ap[1] * ab[1]) / ((ab[0] ** 2 + ab[1] ** 2) || 1), 0, 1); return Math.hypot(ap[0] - ab[0] * t, ap[1] - ab[1] * t); }
canvas.addEventListener('pointerdown', e => {
  if (!gl) return;
  const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (world.antTips) {
    const v = VARIANTS[S.variant];
    for (let i = 0; i < 2; i++) {
      const a = project(world.antBases[i]), b = project(world.antTips[i]), tip = project(add(world.antTips[i], scl(cam.X, v.A.r[2])));
      if (a && b && tip && segDist([x, y], a, b) < Math.max(14, Math.hypot(tip[0] - b[0], tip[1] - b[1]) * 1.3)) {
        ants[i].vz += 7 * ants[i].side; ants[i].vx -= 3; showFace(i ? 'wink' : 'playful', 1400); wake(); return;
      }
    }
  }
  // body: draw now and read back the pixel under the pointer
  draw(performance.now() / 1000);
  const px = new Uint8Array(4);
  gl.readPixels(Math.floor(x / r.width * canvas.width), Math.floor((1 - y / r.height) * canvas.height), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  if (px[3] > 150) {
    const pick = ['happy', 'excited', 'love', 'laughing', 'giggling', 'surprised', 'cheeky', 'proud'];
    const f = pick[(tapCount++) % pick.length];
    showFace(f, 1800);
    if (!(REACT[f] && REACT[f].jump)) jump(1.3);
    S.waveUntil = performance.now() + 1700;
    wake();
  }
});

/* Version switcher */
const seg = $('seg');
Object.entries(VARIANTS).forEach(([key, v]) => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = v.label; b.dataset.v = key;
  b.setAttribute('aria-pressed', 'false'); b.onclick = () => setVariant(key, true);
  seg.appendChild(b);
});
function setVariant(key, greet) {
  if (!VARIANTS[key]) return;
  S.variant = key;
  [...seg.children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === key)));
  ants.forEach(a => { a.x = a.z = a.vx = a.vz = 0; });
  const R = VARIANTS[key].rest;
  Object.assign(pose, { yaw: R.yaw, pitch: R.pitch, roll: R.roll, hyaw: R.hyaw, hpitch: R.hpitch, hroll: R.hroll });
  prevYaw = R.yaw + R.hyaw;
  resize();
  if (gl) { try { program(key); } catch (err) { console.error(err); } }
  if (greet) { showFace('happy', 1500); try { localStorage.setItem('kk-variant', key); } catch (e) {} }
}

/* Face picker */
const grid = $('grid'), sheet = $('sheet'), faceBtn = $('faceBtn');
FACES.forEach(([key, name]) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'tile'; b.dataset.f = key; b.setAttribute('aria-pressed', 'false');
  const c = document.createElement('canvas'); c.width = 208; c.height = 130;
  const s = document.createElement('span'); s.textContent = name;
  b.append(c, s); b.onclick = () => { showFace(key, 6000); wake(); };
  grid.appendChild(b);
});
function paintTiles() { grid.querySelectorAll('.tile').forEach(b => paintMini(b.querySelector('canvas'), b.dataset.f, 0.7)); }
function openSheet(open) { sheet.hidden = !open; faceBtn.setAttribute('aria-expanded', String(open)); if (open) paintTiles(); }
faceBtn.onclick = () => openSheet(sheet.hidden);
$('sheetClose').onclick = () => openSheet(false);
function syncFaceUI(f) {
  shownFace = f;
  $('faceName').textContent = FACE_NAME[f] || 'Neutral';
  paintMini($('faceMini'), f, performance.now() / 1000);
  grid.querySelectorAll('.tile').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === f)));
  paintMini($('avatar'), f, performance.now() / 1000, { bare: true, zoom: 1.05 });
}

/* =====================================================================
   8. CHAT — Claude answers; a mood tag at the start of each reply
      picks the guide's expression.
   ===================================================================== */
const log = $('log'), form = $('form'), q = $('q'), send = $('send'), foot = $('foot'), dot = $('dot'), status = $('status');
const chips = [...document.querySelectorAll('.chip')];
const MOODS = ['happy', 'excited', 'proud', 'love', 'curious', 'thinking', 'confused', 'surprised', 'playful', 'cheeky', 'wink', 'relaxed', 'peaceful', 'determined', 'skeptical', 'shy', 'sad', 'nervous'];
const RULES = `You are the friendly guide mascot on learn.kaykav.academy, the learning platform for KayKav Academy's self-paced course "Built, Not Prompted". The course teaches non-developers (mostly designers) to plan, build and deploy real MVPs using AI tools.
Speak warmly and plainly, like a patient senior builder. When you explain a technical idea, use one short everyday analogy.
Keep every reply under 90 words. Plain text only: no markdown, no headings, no bold.
If you are not sure about a specific detail of the course content, say so and suggest checking the lesson or asking in the community.
Start every reply with exactly one mood tag that fits how you feel about your answer, chosen from: ${MOODS.map(m => '[' + m + ']').join(' ')}. Then a space, then the reply.`;
const PERM = new Set(['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed']);
const ERR = {
  rate_limited: 'The guide needs a short break (usage limit reached). Try again in a little while.',
  session_expired: 'Your Claude session expired. Sign in again, then resend.',
  refused: 'The guide could not answer that one. Try rephrasing your question.',
  empty_completion: 'The guide came back empty. Try asking in a different way.',
  prompt_too_large: 'That message is too long. Try a shorter question.'
};
const turns = [];
let live = null;
let samplePromise = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('sample').catch(() => null) : Promise.resolve(null);
samplePromise.then(s => { if (live === null) { live = !!s; setFoot(); } });
function setFoot() { foot.textContent = live ? 'Live answers from Claude. Each message uses your own Claude usage.' : 'Offline demo: scripted replies. Open this page inside Claude for live answers.'; }
function setStatus(txt, s) { status.textContent = txt; dot.dataset.s = s || ''; }
function addMsg(cls, text) { const d = document.createElement('div'); d.className = cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
const stripTag = s => (s || '').replace(/^\s*\[[a-z]+\]\s*/i, '');
function setBusy(b) { S.busy = b; chips.forEach(c => c.disabled = b); send.textContent = b ? 'Stop' : 'Send'; send.classList.toggle('stop', b); send.type = b ? 'button' : 'submit'; }

const CANNED = [
  [/deploy|host|live|launch|vercel|netlify/i, '[determined] Deploying is like moving your cake from your kitchen to a shop window. On your laptop only you can taste it. Once it is hosted, anyone with the link can. Push your code to GitHub, connect the repo to your host, and it rebuilds the window every time you push.'],
  [/api/i, '[happy] An API is a restaurant waiter. Your app reads the menu, places an order in an agreed format, and the waiter brings back exactly what the kitchen made. You never walk into the kitchen yourself.'],
  [/error|stuck|bug|broken|fail/i, '[curious] Errors are clues, not verdicts. Copy the exact message, note what you clicked right before it appeared, and paste both into your AI tool along with the file it points to. Tell me the message here and we can read it together.'],
  [/build|course|learn|mvp|module|lesson/i, '[proud] You take one idea from a rough brief to a live, deployed MVP. Think of it like building a house: plan the rooms, frame the structure, wire up the data and sign-in, then open the doors to real users.'],
  [/./, '[playful] In this offline demo I only know a few scripted answers. On the live LMS I would answer anything about your lessons, your MVP, or an error you are stuck on. Try asking about deploying, APIs, or getting unstuck.']
];
function fakeStream(text, onText, signal) {
  const reply = CANNED.find(([re]) => re.test(text))[1], words = reply.split(' ');
  return new Promise((resolve, reject) => {
    let i = 0, acc = '', timer;
    const stop = () => { clearTimeout(timer); reject({ code: 'cancelled', text: acc }); };
    signal.addEventListener('abort', stop, { once: true });
    timer = setTimeout(function tick() {
      acc += (i ? ' ' : '') + words[i++]; onText({ text: acc });
      if (i < words.length) timer = setTimeout(tick, 40 + Math.random() * 50); else { signal.removeEventListener('abort', stop); resolve(acc); }
    }, 900);
  });
}

async function ask(text) {
  text = text.trim(); if (!text || S.busy) return;
  addMsg('msg me', text); turns.push({ role: 'user', content: text });
  setBusy(true); S.streaming = false; S.face = null; S.mode = 'thinking'; setStatus('Thinking…', 'think');
  const bubble = addMsg('msg bot pending', 'Thinking…');
  const ctl = new AbortController(); S.ctl = ctl;
  let mood = 'happy', shown = '';
  const onText = ({ text: full }) => {
    if (/^\s*\[[^\]]*$/.test(full)) return;
    const mm = full.match(/^\s*\[([a-z]+)\]\s*/i);
    if (mm) { mood = mm[1].toLowerCase(); full = full.slice(mm[0].length); }
    if (!full) return;
    if (!S.streaming) { S.streaming = true; S.mode = 'talking'; setStatus('Answering', 'talk'); bubble.classList.remove('pending'); }
    S.talk = Math.min(1, S.talk + 0.3 + (full.length - shown.length) * 0.012);
    shown = full; bubble.textContent = full; log.scrollTop = log.scrollHeight;
  };
  try {
    const s = await samplePromise;
    if (ctl.signal.aborted) throw { code: 'cancelled' };
    let final;
    if (s) {
      try { final = (await s([{ role: 'user', content: RULES }, ...turns.slice(-12)], { cache: false, modelTier: 'quick', signal: ctl.signal, onText })).text; }
      catch (e) {
        if (!PERM.has(e && e.code)) throw e;
        live = false; samplePromise = Promise.resolve(null); setFoot();
        addMsg('note', 'Live answers are off for this view, so the guide is using scripted demo replies.');
        log.appendChild(bubble);
        final = await fakeStream(text, onText, ctl.signal);
      }
    } else final = await fakeStream(text, onText, ctl.signal);
    bubble.textContent = stripTag(final) || shown; bubble.classList.remove('pending');
    turns.push({ role: 'assistant', content: final });
    setBusy(false); S.streaming = false; S.mode = 'idle'; setStatus('Ready');
    showFace(FACE_NAME[mood] ? mood : 'happy', 3200);
  } catch (e) {
    const code = (e && e.code) || 'upstream_error';
    const partial = code === 'refused' ? '' : stripTag(e && e.text);
    if (partial) { bubble.textContent = partial + ' …'; bubble.classList.remove('pending'); turns.push({ role: 'assistant', content: partial }); } else bubble.remove();
    if (code === 'cancelled') addMsg('note', 'Stopped.'); else { addMsg('note', ERR[code] || 'The connection dropped. Send your message again to retry.'); showFace('sad', 2500); }
    setBusy(false); S.streaming = false; S.mode = 'idle'; setStatus('Ready');
  }
}
form.addEventListener('submit', e => { e.preventDefault(); const val = q.value; q.value = ''; ask(val); });
send.addEventListener('click', () => { if (S.busy && S.ctl) S.ctl.abort(); });
chips.forEach(c => c.addEventListener('click', () => ask(c.textContent)));
q.addEventListener('input', () => {
  if (S.busy) return;
  S.typingUntil = performance.now() + 1500; S.mode = 'listening';
  clearTimeout(q._t); q._t = setTimeout(() => { if (!S.busy && S.mode === 'listening') S.mode = 'idle'; }, 1600);
  wake();
});

/* ===== Boot ===== */
let start = 'buddy';
try { const sv = localStorage.getItem('kk-variant'); if (VARIANTS[sv]) start = sv; } catch (e) {}
if (window.__KK_VARIANT) start = window.__KK_VARIANT;
updateChatDir(); addEventListener('resize', updateChatDir);
setVariant(start, false);
if (gl && !programs[start]) showFallback('The 3D guide could not start on this device. The chat still works.');
syncFaceUI('neutral');
if (window.__KK_FACE) { S.face = window.__KK_FACE; S.faceUntil = Infinity; } else S.waveUntil = performance.now() + 2000;
requestAnimationFrame(frame);
window.__kk = { S, showFace, setVariant };
})();
</script>
